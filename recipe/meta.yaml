{% set version = "4.16.0" %}
{% set name = "humanize" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7dc2244a2f84a4bfb1d36c37bac80cd78e35cdc5c119206d87b018e1445f3a3f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatch-vcs
    - hatchling >=1.27
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - humanize
    - humanize.filesize
    - humanize.i18n
    - humanize.lists
    - humanize.number
    - humanize.time
  requires:
    - pip
    - pytest
    - freezegun
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -ra -vv --tb=short tests

about:
  home: https://github.com/python-humanize/humanize
  license: MIT
  license_family: MIT
  license_file: LICENCE
  summary: Python humanize utilities
  description: |
    humanize is a Python library that provides a set of utilities for converting
    data into human-readable formats. It includes functions for formatting
    numbers, dates, and times in a way that is easy to read and understand.
  dev_url: https://github.com/python-humanize/humanize
  doc_url: https://humanize.readthedocs.io

extra:
  recipe-maintainers:
    - ericdill
    - licode
    - tacaswell
    - ocefpaf
