{% set version = "4.17.0" %}
{% set name = "humanize" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1d6a36c453dbfbb3f0b34601d2e0b4ce5d48d780305cd45714843f0068fde6ac

build:
  number: 0
  # upstream requires-python >=3.11
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
    - hatch-vcs
    - hatchling >=1.27
  run:
    - python

test:
  # test_i18n.py rewrites the catalogs from the source tree (src/ + scripts/),
  # so the full sdist is needed, not just tests/
  source_files:
    - tests
    - src
    - scripts
  imports:
    - humanize
    - humanize.filesize
    - humanize.i18n
    - humanize.lists
    - humanize.number
    - humanize.time
  requires:
    - pip
    - pytest >=9
    - pytest-codspeed
    - pytest-cov
    - freezegun
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -ra -vv --tb=short tests

about:
  home: https://github.com/python-humanize/humanize
  license: MIT
  license_family: MIT
  license_file: LICENCE
  summary: Python humanize utilities
  description: |
    humanize is a Python library that provides a set of utilities for converting
    data into human-readable formats. It includes functions for formatting
    numbers, dates, and times in a way that is easy to read and understand.
  dev_url: https://github.com/python-humanize/humanize
  doc_url: https://humanize.readthedocs.io

extra:
  recipe-maintainers:
    - ericdill
    - licode
    - tacaswell
    - ocefpaf
